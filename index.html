<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=results/conformance-report.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConform — Conformance Evidence Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: rgba(14, 23, 44, 0.85);
      border: 1px solid #1a2744;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.8rem;
      color: white;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 1.25rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #050811;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.65rem 1.4rem;
      border-radius: 10px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a.btn:hover {
      opacity: 0.9;
    }
  </style>
  <script>
    window.location.replace("results/conformance-report.html");
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">AC</div>
    <h1>AutoConform Evidence</h1>
    <p>Redirecting to the interactive conformance audit dashboard...</p>
    <div class="spinner"></div>
    <a href="results/conformance-report.html" class="btn">Launch Dashboard &rarr;</a>
  </div>
</body>
</html>
